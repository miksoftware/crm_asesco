; ============================================
; Supervisor: Evolution API WebSocket Listener
; ============================================
; Este proceso mantiene la conexión WebSocket con Evolution API
; y re-emite eventos al Broadcasting de Laravel (Reverb).
;
; Instalación:
;   sudo cp deploy/supervisor/evolution-listener.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start evolution-listener
;
; Monitoreo:
;   sudo supervisorctl status evolution-listener
;   sudo supervisorctl tail -f evolution-listener stderr

[program:evolution-listener]
process_name=%(program_name)s
command=php /var/www/crm-asesco/artisan evolution:listen
directory=/var/www/crm-asesco
autostart=true
autorestart=true
startsecs=5
startretries=999
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/crm-asesco/storage/logs/evolution-listener.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=30
stopsignal=SIGTERM
