; ============================================
; Supervisor: Laravel Reverb WebSocket Server
; ============================================
; Servidor WebSocket que recibe eventos de Broadcasting de Laravel
; y los envía a los navegadores conectados via Echo.
;
; Instalación:
;   sudo cp deploy/supervisor/reverb.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start reverb
;
; Monitoreo:
;   sudo supervisorctl status reverb
;   sudo supervisorctl tail -f reverb stderr

[program:reverb]
process_name=%(program_name)s
command=php /var/www/crm-asesco/artisan reverb:start --host=0.0.0.0 --port=6001
directory=/var/www/crm-asesco
autostart=true
autorestart=true
startsecs=5
startretries=999
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/crm-asesco/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=10
stopsignal=SIGTERM
