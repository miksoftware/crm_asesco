# ============================================
# Nginx: Proxy WebSocket para Laravel Reverb
# ============================================
# Agregar este bloque dentro del server {} de tu sitio.
# Permite que los navegadores se conecten a Reverb via el mismo dominio.
#
# Ejemplo: si tu CRM está en crm.asesco.com,
# los WebSockets se conectarán a wss://crm.asesco.com/app/...
#
# Uso:
#   sudo nano /etc/nginx/sites-available/crm-asesco
#   # Agregar el bloque location dentro del server {}
#   sudo nginx -t
#   sudo systemctl reload nginx

# Proxy WebSocket para Laravel Reverb
location /app {
    proxy_pass http://127.0.0.1:6001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts para WebSocket (mantener conexión abierta)
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 7s;
}

# Endpoint de autenticación de canales privados
location /broadcasting/auth {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
