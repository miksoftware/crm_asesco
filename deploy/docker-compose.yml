name: crm-asesco

services:
  php:
    build: .
    image: crm-asesco-php
    container_name: crm-asesco_php
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./php-config/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - crm-asesco_network
      - evolution_api_evolution_api_network
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=true

  mysql:
    image: mysql:8.0
    container_name: crm-asesco_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=256M --sort-buffer-size=4M
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: crm-asesco_db
      MYSQL_USER: crm-asesco_user
      MYSQL_PASSWORD: d25G7CUSWMmV5pfQ
    volumes:
      - crm-asesco_mysql_data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - crm-asesco_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: crm-asesco_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - crm-asesco_redis_data:/data
    networks:
      - crm-asesco_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: crm-asesco_nginx
    restart: unless-stopped
    ports:
      - "8002:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - crm-asesco_network

  # ============================================
  # Laravel Queue Worker
  # ============================================
  queue:
    image: crm-asesco-php
    container_name: crm-asesco_queue
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --memory=256
    volumes:
      - ./src:/var/www/html
      - ./php-config/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - php
      - redis
    networks:
      - crm-asesco_network
      - evolution_api_evolution_api_network
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false

  # ============================================
  # Laravel Reverb - Servidor WebSocket
  # ============================================
  reverb:
    image: crm-asesco-php
    container_name: crm-asesco_reverb
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=6001
    volumes:
      - ./src:/var/www/html
      - ./php-config/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    ports:
      - "6001:6001"
    depends_on:
      - php
      - redis
    networks:
      - crm-asesco_network
      - evolution_api_evolution_api_network
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=true

  # ============================================
  # Evolution API WebSocket Listener
  # ============================================
  evolution-listener:
    image: crm-asesco-php
    container_name: crm-asesco_evolution_listener
    working_dir: /var/www/html
    command: php artisan evolution:listen
    volumes:
      - ./src:/var/www/html
      - ./php-config/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - php
      - redis
    networks:
      - crm-asesco_network
      - evolution_api_evolution_api_network
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false

networks:
  crm-asesco_network:
    driver: bridge
  evolution_api_evolution_api_network:
    external: true

volumes:
  crm-asesco_mysql_data:
  crm-asesco_redis_data:
